# Exemple de reverse proxy HTTPS pour Dashmon.
# En-têtes X-Forwarded-* requis si vous passez par nginx (→ TRUST_PROXY=1).
# Sans proxy, l'exposition directe en http://localhost:8080 suffit.

# Cas A : nginx dans Docker → proxy_pass http://dashmon:8080 (service compose)
# Cas B : nginx sur l'hôte → proxy_pass http://127.0.0.1:8080

server {
    listen 443 ssl;
    http2 on;
    server_name dashmon.example.com;

    ssl_certificate     /etc/letsencrypt/live/dashmon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashmon.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://dashmon:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name dashmon.example.com;
    return 301 https://$host$request_uri;
}