# Exemple de configuration nginx pour Dashmon (reverse proxy HTTPS).
#
# Deux cas possibles selon où tourne nginx :
#
#   A) nginx dans Docker, réseau partagé avec le conteneur dashmon :
#      proxy_pass http://dashmon:8080   (nom du service docker-compose)
#
#   B) nginx sur l'hôte, conteneur lié en loopback :
#      - dans docker-compose.yml : ports: ["127.0.0.1:8080:8080"] au lieu de expose
#      - proxy_pass http://127.0.0.1:8080
#
# Les en-têtes ci-dessous sont requis PAR DASHMON si vous passez par nginx
# (l'image fonctionne aussi parfaitement sans proxy, en accès direct) :
#   - X-Forwarded-For   : IP réelle du client (rate limiter)   → activer TRUST_PROXY=1
#   - X-Forwarded-Proto : déclenche l'envoi du HSTS par le serveur

server {
    listen 443 ssl;
    http2 on;
    server_name dashmon.example.com;

    ssl_certificate     /etc/letsencrypt/live/dashmon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashmon.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS (éventuellement redondant avec celui émis par Dashmon)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://dashmon:8080;   # cas A : nom du service compose

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Laisser Dashmon gérer les vérifications de statut en arrière-plan
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Pas de cache sur les API (CSP/Cache-Control déjà gérés par le serveur)
    }
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name dashmon.example.com;
    return 301 https://$host$request_uri;
}