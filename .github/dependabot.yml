# The Node base image, the npm packages and the GitHub actions are pinned to
# exact versions or digests; Dependabot proposes their updates as pull
# requests, which the workflow checks before anything is merged.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
