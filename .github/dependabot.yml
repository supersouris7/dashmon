# The Node base image, the npm packages and the GitHub actions are pinned to
# exact versions or digests; Dependabot proposes their updates as pull
# requests, which the workflow checks before anything is merged. A release
# is only proposed once it is a week old: time for a compromised package to
# be found and pulled.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Only the LTS lines of Node (even majors): an odd major is supported
    # for six months, then the image would have to move again.
    ignore:
      - dependency-name: node
        versions: [">=25 <26", ">=27 <28", ">=29 <30"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
