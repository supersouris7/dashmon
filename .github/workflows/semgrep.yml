name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Analyse de sécurité
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:1.182.1

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Analyser le code
        run: semgrep scan --config auto --metrics=off .
