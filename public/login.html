<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Dashmon - Connexion</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script src="/js/preload.js"></script>
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body class="login-page">
    <main class="login-panel">
      <img class="login-mark" src="/images/login-monster.png" alt="" />
      <p id="loginCopy" class="login-copy">
        Votre session reste active pendant 30 jours sur cet appareil.
      </p>
      <form id="loginForm" class="login-form">
        <label id="passwordLabel" for="password">Mot de passe</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        />
        <p id="loginError" class="login-error" role="alert" hidden></p>
        <button id="loginBtn" type="submit">Connexion</button>
      </form>
    </main>
    <script src="/js/login.js"></script>
  </body>
</html>
