services:
  dashmon:
    image: supersouris7/dashmon:latest
    container_name: dashmon
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /app/data
      CONFIG_FILE: /app/data/config.json
      ICONS_DIR: /app/data/icons
      # Protège les API en HTTP Basic Auth. Obligatoire : le conteneur écoute
      # sur son réseau Docker, même si le port hôte reste limité à loopback.
      DASHMON_PASSWORD: ${DASHMON_PASSWORD:?Définissez DASHMON_PASSWORD dans .env}
      # 1 uniquement si nginx inverse-proxy le HTTPS derrière
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # 1 uniquement si vos hôtes surveillés ont des certificats auto-signés
      DASHBOARD_INSECURE_TLS: ${DASHBOARD_INSECURE_TLS:-0}
      # Bundle PEM d'autorités privées monté en lecture seule (voir §7 de
      # deploy/DEPLOYMENT.md) : /certs/ca-bundle.pem
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # Chiffre les mots de passe des widgets (ex. Duplicati) dans config.json.
      # Sans clé, les secrets sont stockés en clair (warning au démarrage).
      DASHMON_MASTER_KEY: ${DASHMON_MASTER_KEY:-}
      # Supervision des hôtes et rapports locaux (voir deploy/DEPLOYMENT.md).
      HOST_METRICS_INTERVAL: ${HOST_METRICS_INTERVAL:-60}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      LINUX_METRICS_TOKEN: ${LINUX_METRICS_TOKEN:-}
      DASHBOARD_TOKEN_ENVS: ${DASHBOARD_TOKEN_ENVS:-}
      WIREGUARD_DUMP_FILE: ${WIREGUARD_DUMP_FILE:-}
      SMART_DUMP_FILE: ${SMART_DUMP_FILE:-}
      APT_UPDATES_REPORT_FILE: ${APT_UPDATES_REPORT_FILE:-}
    volumes:
      - dashmon-data:/app/data
    # Résolution DNS des noms locaux (.lan, .home…) pour les pastilles d'état et
    # les widgets (Uptime Kuma compris). Docker ne connaît pas votre DNS LAN :
    # renseignez DASHMON_DNS dans votre pile (adresse IP, pas un nom). 127.0.0.11
    # est le résolveur interne de Docker : la valeur par défaut équivaut à ne
    # rien régler. Voir deploy/DEPLOYMENT.md §6.
    dns:
      - ${DASHMON_DNS:-127.0.0.11}
    # Bundle d'autorités privées pour les certificats de vos services :
    #   - /opt/dashmon/ca-bundle.pem:/certs/ca-bundle.pem:ro

volumes:
  dashmon-data:
