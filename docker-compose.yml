services:
  dashmon:
    image: supersouris7/dashmon:latest
    container_name: dashmon
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /app/data
      CONFIG_FILE: /app/data/config.json
      ICONS_DIR: /app/data/icons
      # Protège les API en HTTP Basic Auth (recommandé en ligne)
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      # 1 uniquement si nginx inverse-proxy le HTTPS derrière
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # 1 uniquement si vos hôtes surveillés ont des certificats auto-signés
      DASHBOARD_INSECURE_TLS: ${DASHBOARD_INSECURE_TLS:-0}
      DASHBOARD_TOKEN_ENVS: ${DASHBOARD_TOKEN_ENVS:-}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      LINUX_METRICS_TOKEN: ${LINUX_METRICS_TOKEN:-}
    volumes:
      - dashmon-data:/app/data
    # Résolution DNS des noms locaux (.lan, .home…) pour les pastilles d'état.
    # Si vos services ne sont pas joignables par nom depuis le conteneur
    # (Docker ne connaît pas votre DNS LAN), pointez vers votre résolveur :
    #   dns:
    #     - 192.168.1.16

volumes:
  dashmon-data:
