services:
  dashmon:
    image: supersouris7/dashmon:latest
    container_name: dashmon
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /app/data
      CONFIG_FILE: /app/data/config.json
      ICONS_DIR: /app/data/icons
      # Login password of the dashboard. Mandatory: the container listens on its
      # Docker network, even when the host port stays limited to loopback.
      DASHMON_PASSWORD: ${DASHMON_PASSWORD:?Set DASHMON_PASSWORD in .env}
      # 1 only if nginx terminates HTTPS in front of the container
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # 1 only if your monitored hosts use self-signed certificates
      DASHBOARD_INSECURE_TLS: ${DASHBOARD_INSECURE_TLS:-0}
      # PEM bundle of private authorities, mounted read-only (see section 8 of
      # deploy/DEPLOYMENT.md): /certs/ca-bundle.pem
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # Encrypts the widget passwords (e.g. Duplicati) in config.json.
      # Mandatory: Dashmon refuses to start without it. Keep it somewhere safe.
      DASHMON_MASTER_KEY: ${DASHMON_MASTER_KEY:?Set DASHMON_MASTER_KEY in .env (openssl rand -hex 32)}
      DASHMON_SYNC_TOKEN: ${DASHMON_SYNC_TOKEN:-}
      # Host supervision and local reports (see deploy/DEPLOYMENT.md).
      HOST_METRICS_INTERVAL: ${HOST_METRICS_INTERVAL:-60}
      WIREGUARD_DUMP_FILE: ${WIREGUARD_DUMP_FILE:-}
      SMART_DUMP_FILE: ${SMART_DUMP_FILE:-}
      APT_UPDATES_REPORT_FILE: ${APT_UPDATES_REPORT_FILE:-}
      OPENCODE_REPORT_FILE: ${OPENCODE_REPORT_FILE:-}
      CLAUDE_REPORT_FILE: ${CLAUDE_REPORT_FILE:-}
    volumes:
      - dashmon-data:/app/data
    # DNS resolution of local names (.lan, .home…) for the status dots and the
    # widgets (Uptime Kuma included). Docker does not know your LAN DNS: set
    # DASHMON_DNS in your stack (an IP address, not a name). 127.0.0.11 is
    # Docker's internal resolver: the default value changes nothing. See
    # section 7 of deploy/DEPLOYMENT.md.
    dns:
      - ${DASHMON_DNS:-127.0.0.11}
    # Bundle of private authorities for the certificates of your services:
    #   - /opt/dashmon/ca-bundle.pem:/certs/ca-bundle.pem:ro

volumes:
  dashmon-data:
